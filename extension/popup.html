<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preciprocal</title>
  <style>
    /* The app's type (app/fonts): Inter for text, Satoshi for headings, bundled. */
    @font-face { font-family: "PrcInter"; src: url("fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "PrcSatoshi"; src: url("fonts/Satoshi-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "PrcSatoshi"; src: url("fonts/Satoshi-700.woff2") format("woff2"); font-weight: 600 900; font-display: swap; }

    /* The dashboard's tokens (app/globals.css), with the brand indigo kept
       for the mark and small accents only. */
    :root {
      --bg: #0b0c0d;
      --sheet: #121315;
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.12);
      --soft: rgba(255,255,255,0.035);
      --soft-2: rgba(255,255,255,0.06);
      --t1: #f7f8f8;
      --t2: #d0d3d8;
      --t3: #8a8f98;
      --t4: #62666d;
      --primary: #f7f8f8;
      --on-primary: #08090a;
      --brand: #8b96ff;
      --good: #22c55e;
      --bad: #f87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 360px; background: var(--bg); font-family: 'PrcInter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--t2); -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }

    /* Header */
    .hdr { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand img { width: 26px; height: 26px; border-radius: 7px; padding: 4px; background: rgba(139,150,255,0.12); }
    .brand span { font-family: 'PrcSatoshi', 'PrcInter', sans-serif; font-weight: 700; font-size: 15px; color: var(--t1); letter-spacing: -0.01em; }
    .status { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; color: var(--t3); background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); }
    .status i { width: 6px; height: 6px; border-radius: 999px; background: var(--t4); }
    .status.on { color: var(--t2); }
    .status.on i { background: var(--good); box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }

    .body { padding: 18px 16px 16px; }

    /* Signed out */
    .h1 { font-family: 'PrcSatoshi', 'PrcInter', sans-serif; font-size: 21px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; color: var(--t1); }
    .sub { margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--t3); }
    .feats { margin-top: 16px; border-radius: 12px; background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); }
    .feat { display: flex; gap: 11px; padding: 12px 13px; }
    .feat + .feat { border-top: 1px solid var(--line); }
    .feat svg { flex-shrink: 0; width: 16px; height: 16px; margin-top: 2px; color: var(--t3); }
    .feat b { display: block; font-size: 13px; font-weight: 600; color: var(--t1); }
    .feat span { display: block; margin-top: 2px; font-size: 12px; line-height: 1.45; color: var(--t3); }

    .btn { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; height: 38px; border: 0; border-radius: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: opacity .15s, background .15s; }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-primary:hover { opacity: .9; }
    .btn-ghost { background: transparent; color: var(--t3); height: 34px; font-weight: 500; }
    .btn-ghost:hover { color: var(--t1); background: var(--soft); }
    .cta { margin-top: 16px; }
    .note { margin-top: 8px; text-align: center; font-size: 11.5px; color: var(--t4); }

    .steps { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
    .step { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--t3); }
    .step em { font-style: normal; width: 18px; height: 18px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 600; color: var(--t2); background: var(--soft-2); flex-shrink: 0; }

    details.token { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
    details.token summary { list-style: none; cursor: pointer; font-size: 12px; color: var(--t3); }
    details.token summary::-webkit-details-marker { display: none; }
    details.token summary:hover { color: var(--t1); }
    .token-row { display: flex; gap: 6px; margin-top: 9px; }
    .token-input { flex: 1; min-width: 0; height: 34px; padding: 0 10px; border-radius: 8px; border: 0; outline: none; background: var(--soft); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--t1); font-size: 12px; font-family: inherit; }
    .token-input::placeholder { color: var(--t4); }
    .token-input:focus { box-shadow: inset 0 0 0 1px rgba(139,150,255,0.6); }
    .btn-token { height: 34px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--soft-2); color: var(--t1); font-size: 12px; font-weight: 600; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line-2); }
    .btn-token:hover { background: rgba(255,255,255,0.09); }
    .btn-token:disabled { opacity: .5; cursor: default; }
    .token-error { margin-top: 7px; font-size: 11.5px; line-height: 1.4; color: var(--bad); }

    /* Signed in */
    .user { display: flex; align-items: center; gap: 11px; padding: 12px; border-radius: 12px; background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); }
    .av { width: 38px; height: 38px; border-radius: 999px; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #2a2c58; color: var(--t1); font-weight: 600; font-size: 15px; }
    .av img { width: 100%; height: 100%; object-fit: cover; }
    .u-info { min-width: 0; flex: 1; }
    .u-name { font-size: 13.5px; font-weight: 600; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .u-email { margin-top: 1px; font-size: 12px; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tier { height: 22px; padding: 0 8px; display: inline-flex; align-items: center; border-radius: 6px; font-size: 11px; font-weight: 600; color: var(--t2); background: var(--soft-2); flex-shrink: 0; }
    .tier.pro { color: var(--brand); background: rgba(139,150,255,0.12); }
    .ready { margin-top: 12px; display: flex; gap: 9px; padding: 11px 12px; border-radius: 10px; font-size: 12px; line-height: 1.45; color: var(--t3); background: rgba(34,197,94,0.06); box-shadow: inset 0 0 0 1px rgba(34,197,94,0.18); }
    .ready svg { flex-shrink: 0; width: 14px; height: 14px; margin-top: 2px; color: var(--good); }
    .ready b { color: var(--t1); font-weight: 600; }
    .links { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .link { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 11px; border-radius: 10px; border: 0; background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); color: var(--t2); font-size: 12.5px; font-weight: 500; cursor: pointer; text-align: left; transition: background .15s, color .15s; }
    .link:hover { background: var(--soft-2); color: var(--t1); }
    .link svg { width: 15px; height: 15px; color: var(--t3); flex-shrink: 0; }
    .actions { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; }

    .foot { display: flex; justify-content: space-between; padding: 10px 16px 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--t4); }

    /* Loading */
    .loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 48px 16px; font-size: 12.5px; color: var(--t3); }
    .spin { width: 22px; height: 22px; border-radius: 999px; border: 2px solid var(--line-2); border-top-color: var(--t1); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div id="authContainer"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
